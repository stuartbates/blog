<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f0e8">
    {% seo %}
    {% feed_meta %}
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include navbar.html %}

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p class="footer-signoff">Crafted with love in Bristol, UK.</p>
        <div class="footer-links" aria-label="Elsewhere">
          <a href="mailto:{{ site.email }}">Email</a>
          <a href="https://github.com/{{ site.github_username }}" rel="me">GitHub</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </div>
        <p class="footer-small">&copy; {{ 'now' | date: '%Y' }} Stuart Bates</p>
      </div>
    </footer>
  </body>
</html>
